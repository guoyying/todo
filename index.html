<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>心事与任务</title>
    <style>
        :root {
            --bg: #f5f5f0;
            --card: #ffffff;
            --text: #333333;
            --text-secondary: #888888;
            --border: #e0e0d8;
            --primary: #6b8e6b;
            --primary-light: #e8f0e8;
            --feeling: #d4a5a5;
            --feeling-light: #f5e8e8;
            --task: #8fa8c8;
            --task-light: #e8eef5;
            --danger: #c87070;
            --radius: 12px;
            --shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            padding: 20px;
            max-width: 900px;
            margin: 0 auto;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 12px;
        }
        h1 { font-size: 22px; font-weight: 600; color: var(--text); }
        .github-bar {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }
        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: var(--radius);
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { opacity: 0.9; }
        .btn-secondary { background: var(--card); color: var(--text); border: 1px solid var(--border); }
        .btn-secondary:hover { background: var(--bg); }
        .btn-danger { background: var(--danger); color: white; }
        .btn-small { padding: 4px 10px; font-size: 12px; }
        .card {
            background: var(--card);
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: var(--shadow);
        }
        .type-select {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
        }
        .type-btn {
            flex: 1;
            padding: 14px;
            border: 2px solid var(--border);
            border-radius: var(--radius);
            background: var(--card);
            cursor: pointer;
            text-align: center;
            font-size: 15px;
            transition: all 0.2s;
        }
        .type-btn.active {
            border-color: var(--primary);
            background: var(--primary-light);
            font-weight: 500;
        }
        .input-group { margin-bottom: 14px; }
        .input-group label {
            display: block;
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }
        textarea, input[type="text"], input[type="datetime-local"], select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            resize: vertical;
            background: var(--card);
        }
        textarea:focus, input:focus, select:focus {
            outline: none;
            border-color: var(--primary);
        }
        .input-actions {
            display: flex;
            gap: 8px;
            margin-top: 8px;
            flex-wrap: wrap;
        }
        .voice-btn {
            background: var(--feeling-light);
            color: var(--text);
            border: 1px solid var(--feeling);
        }
        .voice-btn.recording {
            background: var(--feeling);
            color: white;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }
        .tags-select {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 6px;
        }
        .tag {
            padding: 3px 8px 3px 10px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            border: 1px solid var(--border);
            background: var(--bg);
            user-select: none;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .tag .tag-del {
            font-size: 11px;
            width: 14px;
            height: 14px;
            line-height: 14px;
            text-align: center;
            border-radius: 50%;
            color: var(--text-secondary);
            cursor: pointer;
            display: inline-block;
        }
        .tag .tag-del:hover { background: var(--danger); color: white; }
        .tag.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }
        .tag-editor {
            display: flex;
            gap: 6px;
            margin-top: 8px;
        }
        .tag-editor input { flex: 1; }
        .section-title {
            font-size: 15px;
            font-weight: 600;
            margin: 24px 0 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .section-title .count {
            font-size: 12px;
            color: var(--text-secondary);
            font-weight: normal;
        }
        .item {
            background: var(--card);
            border-radius: var(--radius);
            padding: 14px 16px;
            margin-bottom: 10px;
            box-shadow: var(--shadow);
            position: relative;
            transition: all 0.2s;
        }
        .item.feeling-item { border-left: 4px solid var(--feeling); }
        .item.task-item { border-left: 4px solid var(--task); }
        .item.done { opacity: 0.7; }
        .item.done .item-content { text-decoration: line-through; color: var(--text-secondary); }
        .item-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 6px;
        }
        .item-type {
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 12px;
            font-weight: 500;
        }
        .item-type.feeling { background: var(--feeling-light); color: #8b5a5a; }
        .item-type.task { background: var(--task-light); color: #5a7090; }
        .item-time { font-size: 12px; color: var(--text-secondary); }
        .item-content { font-size: 14px; margin: 6px 0; white-space: pre-wrap; word-break: break-word; }
        .item-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
        .item-tag {
            font-size: 11px;
            padding: 1px 8px;
            border-radius: 10px;
            background: var(--bg);
            color: var(--text-secondary);
        }
        .item-actions {
            display: flex;
            gap: 6px;
            margin-top: 10px;
            opacity: 0;
            transition: opacity 0.2s;
        }
        .item:hover .item-actions { opacity: 1; }
        @media (pointer: coarse) {
            .item-actions { opacity: 1; }
        }
        .item-actions .btn { padding: 4px 10px; font-size: 12px; }
        .checkbox {
            width: 20px;
            height: 20px;
            border: 2px solid var(--border);
            border-radius: 50%;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-right: 8px;
            flex-shrink: 0;
        }
        .checkbox.checked {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
        }
        .subtask-list { margin: 10px 0 0 24px; }
        .subtask {
            display: flex;
            align-items: center;
            padding: 6px 0;
            gap: 8px;
            font-size: 13px;
        }
        .subtask .checkbox { width: 16px; height: 16px; }
        .subtask.done { text-decoration: line-through; color: var(--text-secondary); }
        .subtask input {
            flex: 1;
            border: none;
            background: transparent;
            font-size: 13px;
            font-family: inherit;
            border-bottom: 1px dashed transparent;
            padding: 2px;
        }
        .subtask input:focus {
            outline: none;
            border-bottom-color: var(--primary);
        }
        .time-slots {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 12px;
            margin-top: 12px;
        }
        .slot {
            background: var(--card);
            border-radius: var(--radius);
            padding: 14px;
            box-shadow: var(--shadow);
            min-height: 120px;
        }
        .slot-header {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .slot .item { margin-bottom: 8px; padding: 10px; font-size: 13px; }
        .slot .item-actions { opacity: 1; }
        .slot-delete { cursor: pointer; color: var(--text-secondary); font-size: 12px; }
        .slot-delete:hover { color: var(--danger); }
        .add-slot {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }
        .add-slot input { flex: 1; }
        .collapsed {
            opacity: 0.6;
            cursor: pointer;
            padding: 10px 16px;
            background: var(--bg);
            border-radius: var(--radius);
            margin-bottom: 10px;
            font-size: 13px;
            color: var(--text-secondary);
        }
        .collapsed:hover { opacity: 1; }
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 20px;
        }
        .modal {
            background: var(--card);
            border-radius: var(--radius);
            padding: 24px;
            width: 100%;
            max-width: 420px;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
        }
        .modal h3 { margin-bottom: 16px; font-size: 16px; }
        .modal .input-group { margin-bottom: 14px; }
        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 20px;
        }
        .hidden { display: none !important; }
        .empty-tip {
            text-align: center;
            color: var(--text-secondary);
            font-size: 13px;
            padding: 20px;
        }
        .due-select { margin-bottom: 10px; }
        .history-section { margin-top: 24px; }
        .history-header {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px;
            background: var(--bg);
            border-radius: var(--radius);
            cursor: pointer;
            color: var(--text-secondary);
            font-size: 13px;
        }
        .history-content { margin-top: 10px; }
        .subtask-place-btn {
            font-size: 11px;
            padding: 2px 8px;
            margin-left: 8px;
            background: var(--task-light);
            border: 1px solid var(--task);
            border-radius: 4px;
            cursor: pointer;
            color: #5a7090;
        }
        .subtask-place-btn:hover { background: var(--task); color: white; }
        .place-select-overlay {
            position: absolute;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px;
            box-shadow: var(--shadow);
            z-index: 10;
            min-width: 140px;
        }
        .place-option {
            padding: 6px 10px;
            cursor: pointer;
            font-size: 13px;
            border-radius: 4px;
        }
        .place-option:hover { background: var(--bg); }
        .feeling-input-area { display: none; }
        .feeling-input-area.active { display: block; }
        .task-input-area { display: none; }
        .task-input-area.active { display: block; }
        .unknown-notice {
            font-size: 12px;
            color: var(--text-secondary);
            background: var(--bg);
            padding: 8px 12px;
            border-radius: 8px;
            margin-bottom: 10px;
        }
        .unknown-subtasks { margin-top: 10px; }
        .unknown-subtasks .subtask { padding: 4px 0; }
        .unknown-subtasks input { background: var(--bg); padding: 4px 8px; border-radius: 4px; border: 1px solid var(--border); }
        .unknown-subtasks input:focus { background: var(--card); }
        .update-banner {
            background: #ff9800;
            color: white;
            padding: 10px 16px;
            border-radius: var(--radius);
            margin-bottom: 16px;
            display: none;
            align-items: center;
            justify-content: space-between;
            box-shadow: var(--shadow);
        }
        .update-banner.show { display: flex; }
        .update-banner span { font-size: 14px; }
    </style>
</head>
<body>
    <div class="header">
        <h1 id="pageTitle" onclick="showPageSettings()" style="cursor:pointer;">🌿 心事与任务</h1>
        <div class="github-bar">
            <span id="githubStatus" style="font-size:12px;color:var(--text-secondary);"></span>
            <button class="btn btn-secondary btn-small" onclick="showPageSettings()">页面设置</button>
            <button class="btn btn-secondary btn-small" onclick="showGithubConfig()">GitHub设置</button>
            <button class="btn btn-secondary btn-small" onclick="pullFromGithub(true)">拉取</button>
            <button class="btn btn-primary btn-small" onclick="pushToGithub()">推送</button>
        </div>
    </div>
    <div class="update-banner" id="updateBanner">
        <span>📢 有更新待推送</span>
        <button class="btn btn-small" style="background:white;color:#ff9800;" onclick="pushToGithub()">立即推送</button>
    </div>

    <div class="card">
        <div class="type-select">
            <div class="type-btn" data-type="feeling" onclick="selectType('feeling')">💭 感受</div>
            <div class="type-btn" data-type="task" onclick="selectType('task')">📝 想做的事</div>
        </div>

        <div class="feeling-input-area" id="feelingArea">
            <div class="input-group">
                <label>此刻的感受</label>
                <textarea id="feelingContent" rows="3" placeholder="写下你的感受..."></textarea>
                <div class="input-actions">
                    <button class="btn btn-secondary voice-btn" id="feelingVoiceBtn" onclick="toggleVoice('feeling')">🎤 语音输入</button>
                </div>
            </div>
            <div class="input-group">
                <label>标签</label>
                <div class="tags-select" id="feelingTags"></div>
            </div>
            <button class="btn btn-primary" onclick="saveFeeling()">记录感受</button>
        </div>

        <div class="task-input-area" id="taskArea">
            <div class="input-group">
                <label>想做的事</label>
                <textarea id="taskContent" rows="2" placeholder="写下你想做的事..."></textarea>
                <div class="input-actions">
                    <button class="btn btn-secondary voice-btn" id="taskVoiceBtn" onclick="toggleVoice('task')">🎤 语音输入</button>
                </div>
            </div>
            <div class="input-group">
                <label>预计完成时间</label>
                <div class="due-select">
                    <label style="display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-size:14px;color:var(--text);">
                        <input type="radio" name="dueType" value="known" checked onchange="toggleDueType()"> 已知
                    </label>
                    <label style="display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-size:14px;color:var(--text);margin-left:16px;">
                        <input type="radio" name="dueType" value="unknown" onchange="toggleDueType()"> 未知（需要拆解）
                    </label>
                </div>
                <input type="text" id="taskDueTime" placeholder="预计时间（如：2小时、30分钟）">
                <div class="unknown-notice hidden" id="unknownNotice">
                    因为时间未知，请把任务拆解为更小的步骤：
                </div>
                <div class="unknown-subtasks hidden" id="unknownSubtasks">
                    <div class="subtask"><input type="text" placeholder="子任务 1" class="subtask-input"></div>
                    <div class="subtask"><input type="text" placeholder="子任务 2" class="subtask-input"></div>
                    <div class="subtask"><input type="text" placeholder="子任务 3" class="subtask-input"></div>
                </div>
            </div>
            <div class="input-group">
                <label>标签</label>
                <div class="tags-select" id="taskTags"></div>
            </div>
            <button class="btn btn-primary" onclick="saveTask()">添加任务</button>
        </div>
    </div>

    <div class="section-title">📌 时间段任务板 <span class="count" id="slotCount"></span></div>
    <div class="time-slots" id="timeSlots"></div>
    <div class="add-slot">
        <input type="text" id="newSlotName" placeholder="添加时间段，如今日下午、本周内...">
        <button class="btn btn-secondary" onclick="addSlot()">添加</button>
    </div>

    <div class="section-title">📋 待办 <span class="count" id="todayCount"></span></div>
    <div id="todayList"></div>

    <div class="section-title">💭 感受记录 <span class="count" id="feelingCount"></span></div>
    <div id="feelingList"></div>

    <div class="section-title">✅ 今日完成 <span class="count" id="doneCount"></span></div>
    <div id="doneList"></div>

    <div class="history-section">
        <div class="history-header" onclick="toggleHistory()">
            <span id="historyArrow">▶</span>
            <span>往期记录（点击展开）</span>
            <span class="count" id="historyCount"></span>
        </div>
        <div class="history-content hidden" id="historyContent"></div>
    </div>

    <div class="modal-overlay hidden" id="githubModal">
        <div class="modal">
            <h3>GitHub 配置</h3>
            <div class="input-group">
                <label>用户名</label>
                <input type="text" id="ghUsername" placeholder="your-github-username">
            </div>
            <div class="input-group">
                <label>仓库名称</label>
                <input type="text" id="ghRepo" placeholder="todo-data">
            </div>
            <div class="input-group">
                <label>Issue编号</label>
                <input type="text" id="ghIssue" placeholder="1">
            </div>
            <div class="input-group">
                <label>Personal Access Token</label>
                <input type="text" id="ghToken" placeholder="ghp_xxxxxxxxxxxx">
            </div>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeGithubModal()">取消</button>
                <button class="btn btn-primary" onclick="saveGithubConfig()">保存</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay hidden" id="editModal">
        <div class="modal">
            <h3>编辑</h3>
            <div class="input-group">
                <textarea id="editContent" rows="4"></textarea>
            </div>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeEditModal()">取消</button>
                <button class="btn btn-primary" onclick="saveEdit()">保存</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay hidden" id="pageSettingsModal">
        <div class="modal">
            <h3>页面设置</h3>
            <div class="input-group">
                <label>网页标题</label>
                <input type="text" id="settingTitle" placeholder="心事与任务">
            </div>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closePageSettings()">取消</button>
                <button class="btn btn-primary" onclick="savePageSettings()">保存</button>
            </div>
        </div>
    </div>

    <script>
        // ============ Data ============
        let data = {
            items: [],
            slots: [{id:'slot_today',name:'今日'},{id:'slot_afternoon',name:'今日下午'}],
            tags: ['工作','生活','重要','灵感','情绪'],
            commonTags: ['生活','工作'],
            github: null,
            firstLoaded: false,
            title: '🌿 心事与任务'
        };
        let editingId = null;
        let recording = null;
        let recognition = null;

        const STORAGE_KEY = 'mindtodo_data';

        function loadData() {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (raw) {
                try {
                    const parsed = JSON.parse(raw);
                    data = { ...data, ...parsed };
                } catch(e) {}
            }
        }

        function saveData() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        }

        function genId() {
            return Date.now().toString(36) + Math.random().toString(36).slice(2,7);
        }

        function nowStr() {
            return new Date().toISOString();
        }

        function fmtTime(iso) {
            const d = new Date(iso);
            const today = new Date();
            const isToday = d.getDate() === today.getDate() && d.getMonth() === today.getMonth() && d.getFullYear() === today.getFullYear();
            const h = d.getHours().toString().padStart(2,'0');
            const m = d.getMinutes().toString().padStart(2,'0');
            if (isToday) return `今天 ${h}:${m}`;
            const mm = (d.getMonth()+1).toString().padStart(2,'0');
            const dd = d.getDate().toString().padStart(2,'0');
            return `${mm}-${dd} ${h}:${m}`;
        }

        function isToday(iso) {
            const d = new Date(iso);
            const t = new Date();
            return d.getDate() === t.getDate() && d.getMonth() === t.getMonth() && d.getFullYear() === t.getFullYear();
        }

        function isBeforeToday(iso) {
            const d = new Date(iso);
            const t = new Date();
            t.setHours(0,0,0,0);
            return d < t;
        }

        // ============ Voice ============
        function initVoice() {
            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) return;
            const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SR();
            recognition.lang = 'zh-CN';
            recognition.continuous = false;
            recognition.interimResults = true;
        }

        function toggleVoice(target) {
            if (!recognition) {
                alert('您的浏览器不支持语音输入');
                return;
            }
            const btn = document.getElementById(target + 'VoiceBtn');
            const area = document.getElementById(target + 'Content');
            if (recording === target) {
                recognition.stop();
                recording = null;
                btn.classList.remove('recording');
                btn.textContent = '🎤 语音输入';
                return;
            }
            if (recording) {
                recognition.stop();
                document.getElementById(recording + 'VoiceBtn').classList.remove('recording');
                document.getElementById(recording + 'VoiceBtn').textContent = '🎤 语音输入';
            }
            recording = target;
            btn.classList.add('recording');
            btn.textContent = '🔴 停止录音';
            let finalTranscript = '';
            recognition.onresult = (e) => {
                let interim = '';
                for (let i = e.resultIndex; i < e.results.length; i++) {
                    if (e.results[i].isFinal) finalTranscript += e.results[i][0].transcript;
                    else interim += e.results[i][0].transcript;
                }
                area.value = (area.value ? area.value + ' ' : '') + finalTranscript + interim;
            };
            recognition.onerror = () => {
                recording = null;
                btn.classList.remove('recording');
                btn.textContent = '🎤 语音输入';
            };
            recognition.onend = () => {
                if (recording === target) {
                    recording = null;
                    btn.classList.remove('recording');
                    btn.textContent = '🎤 语音输入';
                }
            };
            recognition.start();
        }

        // ============ Type Select ============
        function selectType(type) {
            document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
            document.querySelector(`.type-btn[data-type="${type}"]`).classList.add('active');
            document.getElementById('feelingArea').classList.toggle('active', type === 'feeling');
            document.getElementById('taskArea').classList.toggle('active', type === 'task');
        }

        function toggleDueType() {
            const unknown = document.querySelector('input[name="dueType"]:checked').value === 'unknown';
            document.getElementById('taskDueTime').classList.toggle('hidden', unknown);
            document.getElementById('unknownNotice').classList.toggle('hidden', !unknown);
            document.getElementById('unknownSubtasks').classList.toggle('hidden', !unknown);
        }

        // ============ Tags ============
        function renderTags(containerId, selected=[]) {
            const el = document.getElementById(containerId);
            el.innerHTML = '';
            const allTags = [...new Set([...data.tags, ...data.commonTags])];
            allTags.forEach(tag => {
                const span = document.createElement('span');
                span.className = 'tag' + (selected.includes(tag) ? ' active' : '');
                const text = document.createElement('span');
                text.textContent = tag;
                text.onclick = (e) => { e.stopPropagation(); span.classList.toggle('active'); };
                const del = document.createElement('span');
                del.className = 'tag-del';
                del.textContent = '×';
                del.title = '删除标签';
                del.onclick = (e) => { e.stopPropagation(); deleteTag(tag); };
                span.appendChild(text);
                span.appendChild(del);
                el.appendChild(span);
            });
            const editor = document.createElement('div');
            editor.className = 'tag-editor';
            editor.innerHTML = `<input type="text" placeholder="新标签" id="${containerId}New"><button class="btn btn-small btn-secondary" onclick="addTag('${containerId}')">添加</button>`;
            el.appendChild(editor);
        }

        function getSelectedTags(containerId) {
            return Array.from(document.querySelectorAll(`#${containerId} .tag.active`)).map(el => el.textContent);
        }

        function addTag(containerId) {
            const input = document.getElementById(containerId + 'New');
            const v = input.value.trim();
            if (!v) return;
            if (!data.tags.includes(v)) data.tags.push(v);
            renderTags(containerId, getSelectedTags(containerId).concat(v));
            saveData();
        }

        function deleteTag(tag) {
            data.tags = data.tags.filter(t => t !== tag);
            data.commonTags = data.commonTags.filter(t => t !== tag);
            data.items.forEach(i => {
                if (i.tags) i.tags = i.tags.filter(t => t !== tag);
            });
            saveData(); render();
        }

        // ============ Save ============
        function saveFeeling() {
            const content = document.getElementById('feelingContent').value.trim();
            if (!content) return;
            const item = {
                id: genId(), type: 'feeling', content,
                createdAt: nowStr(), updatedAt: nowStr(),
                tags: getSelectedTags('feelingTags'), done: false
            };
            data.items.push(item);
            document.getElementById('feelingContent').value = '';
            renderTags('feelingTags');
            saveData(); render();
        }

        function saveTask() {
            const content = document.getElementById('taskContent').value.trim();
            if (!content) return;
            const unknown = document.querySelector('input[name="dueType"]:checked').value === 'unknown';
            let dueTime = null;
            if (!unknown) {
                const v = document.getElementById('taskDueTime').value.trim();
                if (v) dueTime = v;
            }
            let subtasks = [];
            if (unknown) {
                subtasks = Array.from(document.querySelectorAll('#unknownSubtasks .subtask-input'))
                    .map(i => i.value.trim()).filter(Boolean)
                    .map(t => ({id: genId(), content: t, done: false, placedIn: null}));
            }
            const item = {
                id: genId(), type: 'task', content,
                createdAt: nowStr(), updatedAt: nowStr(),
                tags: getSelectedTags('taskTags'), done: false,
                dueTime, unknown: !!unknown, subtasks
            };
            data.items.push(item);
            document.getElementById('taskContent').value = '';
            document.getElementById('taskDueTime').value = '';
            document.querySelectorAll('#unknownSubtasks .subtask-input').forEach(i => i.value = '');
            document.querySelector('input[name="dueType"][value="known"]').checked = true;
            toggleDueType();
            renderTags('taskTags');
            saveData(); render();
        }

        // ============ Render ============
        function render() {
            renderTags('feelingTags');
            renderTags('taskTags');
            renderSlots();
            renderFeelings();
            renderToday();
            renderDone();
            renderHistory();
            checkUpdateStatus();
        }

        function renderItem(item, options={}) {
            const el = document.createElement('div');
            el.className = `item ${item.type}-item ${item.done ? 'done' : ''}`;
            el.dataset.id = item.id;

            const header = document.createElement('div');
            header.className = 'item-header';
            const typeLabel = item.type === 'feeling' ? '感受' : '任务';
            const typeClass = item.type;
            let timeInfo = fmtTime(item.createdAt);
            if (item.updatedAt !== item.createdAt) timeInfo += ' (已编辑)';
            if (item.type === 'task' && item.dueTime && !item.unknown) {
                timeInfo += ` | 预计${item.dueTime}`;
            }
            header.innerHTML = `
                <span class="item-type ${typeClass}">${typeLabel}</span>
                <span class="item-time">${timeInfo}</span>
            `;
            el.appendChild(header);

            const contentDiv = document.createElement('div');
            contentDiv.className = 'item-content';
            if (options.showCheckbox && item.type === 'task') {
                const cb = document.createElement('span');
                cb.className = 'checkbox' + (item.done ? ' checked' : '');
                cb.innerHTML = item.done ? '✓' : '';
                cb.onclick = () => toggleDone(item.id);
                contentDiv.appendChild(cb);
            }
            if (options.editable && item.type === 'task' && !item.done) {
                const textInput = document.createElement('input');
                textInput.type = 'text';
                textInput.value = item.content;
                textInput.style.flex = '1';
                textInput.style.border = 'none';
                textInput.style.background = 'transparent';
                textInput.style.fontSize = '14px';
                textInput.style.fontFamily = 'inherit';
                textInput.style.padding = '2px';
                textInput.onchange = (e) => {
                    item.content = e.target.value;
                    item.updatedAt = nowStr();
                    saveData();
                };
                textInput.onblur = (e) => {
                    item.content = e.target.value;
                    item.updatedAt = nowStr();
                    saveData();
                };
                contentDiv.appendChild(textInput);
                
                if (!item.unknown) {
                    const timeInput = document.createElement('input');
                    timeInput.type = 'text';
                    timeInput.value = item.dueTime || '';
                    timeInput.placeholder = '预计时间';
                    timeInput.style.width = '100px';
                    timeInput.style.marginLeft = '8px';
                    timeInput.style.border = '1px solid var(--border)';
                    timeInput.style.borderRadius = '4px';
                    timeInput.style.padding = '2px 6px';
                    timeInput.style.fontSize = '12px';
                    timeInput.onchange = (e) => {
                        item.dueTime = e.target.value;
                        item.updatedAt = nowStr();
                        saveData();
                        render();
                    };
                    timeInput.onblur = (e) => {
                        item.dueTime = e.target.value;
                        item.updatedAt = nowStr();
                        saveData();
                        render();
                    };
                    contentDiv.appendChild(timeInput);
                }
            } else if (item.type === 'task' && item.unknown && item.subtasks && item.subtasks.length) {
                // 显示父任务内容
                const textSpan = document.createElement('span');
                textSpan.textContent = item.content;
                contentDiv.appendChild(textSpan);
            } else {
                const textSpan = document.createElement('span');
                textSpan.textContent = item.content;
                contentDiv.appendChild(textSpan);
            }
            el.appendChild(contentDiv);

            if (item.tags && item.tags.length) {
                const tagsDiv = document.createElement('div');
                tagsDiv.className = 'item-tags';
                item.tags.forEach(t => {
                    const s = document.createElement('span');
                    s.className = 'item-tag';
                    s.textContent = t;
                    tagsDiv.appendChild(s);
                });
                el.appendChild(tagsDiv);
            }

            if (item.type === 'task' && item.unknown && item.subtasks && item.subtasks.length) {
                const stDiv = document.createElement('div');
                stDiv.className = 'subtask-list';
                item.subtasks.forEach(st => {
                    const row = document.createElement('div');
                    row.className = 'subtask' + (st.done ? ' done' : '');
                    const cb = document.createElement('span');
                    cb.className = 'checkbox' + (st.done ? ' checked' : '');
                    cb.innerHTML = st.done ? '✓' : '';
                    cb.onclick = (e) => { e.stopPropagation(); toggleSubtask(item.id, st.id); };
                    const txt = document.createElement('span');
                    txt.textContent = st.content;
                    txt.style.flex = '1';
                    row.appendChild(cb);
                    row.appendChild(txt);
                    if (!st.placedIn && !st.done) {
                        const placeBtn = document.createElement('button');
                        placeBtn.className = 'subtask-place-btn';
                        placeBtn.textContent = '放入时间段';
                        placeBtn.onclick = (e) => showPlaceMenu(e, item.id, st.id);
                        row.appendChild(placeBtn);
                    } else if (st.placedIn) {
                        const slot = data.slots.find(s => s.id === st.placedIn);
                        const badge = document.createElement('span');
                        badge.className = 'item-tag';
                        badge.textContent = slot ? slot.name : st.placedIn;

                    stDiv.appendChild(row);
                });
                el.appendChild(stDiv);
            }

            const actions = document.createElement('div');
            actions.className = 'item-actions';

            if (item.type === 'task' && !item.unknown && !item.placedIn && !item.done) {
                actionButtons += `<button class="btn btn-secondary btn-small" onclick="showTaskPlaceMenu(event, '${item.id}')">放入时间段</button>`;
            }
            actionButtons += `<button class="btn btn-danger btn-small" onclick="deleteItem('${item.id}')">删除</button>`;
            actions.innerHTML = actionButtons;
            el.appendChild(actions);

            return el;
        }

        function renderSlots() {
            const container = document.getElementById('timeSlots');
            container.innerHTML = '';
            let slotTotal = 0;
            data.slots.forEach(slot => {
                const placed = data.items.filter(i =>
                    i.type === 'task' && i.unknown && i.subtasks &&
                    i.subtasks.some(st => st.placedIn === slot.id && !st.done)
                );
                const simpleTasks = data.items.filter(i =>
                    i.type === 'task' && !i.unknown && !i.done && i.placedIn === slot.id
                );
                const allInSlot = [];
                placed.forEach(i => {
                    i.subtasks.filter(st => st.placedIn === slot.id && !st.done).forEach(st => {
                        allInSlot.push({kind:'sub', parent:i, sub:st});
                    });
                });
                simpleTasks.forEach(i => allInSlot.push({kind:'item', item:i}));
                slotTotal += allInSlot.length;

                const slotEl = document.createElement('div');
                slotEl.className = 'slot';
                slotEl.innerHTML = `
                    <div class="slot-header">
                        <span>${slot.name}</span>
                        <span class="slot-delete" onclick="deleteSlot('${slot.id}')">✕</span>
                    </div>
                `;
                if (allInSlot.length === 0) {
                    slotEl.innerHTML += '<div class="empty-tip">暂无任务</div>';
                } else {
                    allInSlot.forEach(entry => {
                        if (entry.kind === 'sub') {
                            const wrapper = document.createElement('div');
                            wrapper.className = 'item task-item';
                            wrapper.innerHTML = `
                                <div style="font-size:12px;color:var(--text-secondary);margin-bottom:2px;">来自：${entry.parent.content}</div>
                                <div class="item-content" style="display:flex;align-items:center;">
                                    <span class="checkbox" onclick="toggleSubtaskDone('${entry.parent.id}','${entry.sub.id}')"></span>
                                    <span>${entry.sub.content}</span>
                                </div>
                                <div class="item-actions" style="opacity:1;margin-top:6px;">
                                    <button class="btn btn-secondary btn-small" onclick="removeFromSlot('${entry.parent.id}','${entry.sub.id}')">返回待办</button>
                                </div>
                            `;
                            slotEl.appendChild(wrapper);
                        } else {
                            const wrapper = document.createElement('div');
                            wrapper.className = 'item task-item';
                            wrapper.innerHTML = `
                                <div style="font-size:12px;color:var(--text-secondary);margin-bottom:2px;">来自：${entry.item.content}</div>
                                <div class="item-content" style="display:flex;align-items:center;">
                                    <span class="checkbox" onclick="toggleDone('${entry.item.id}')"></span>
                                    <span>${entry.item.content}</span>
                                </div>
                                <div class="item-actions" style="opacity:1;margin-top:6px;">
                                    <button class="btn btn-secondary btn-small" onclick="removeFromSlotSimple('${entry.item.id}')">返回待办</button>
                                </div>
                            `;
                            slotEl.appendChild(wrapper);
                        }
                    });
                }
                container.appendChild(slotEl);
            });
            document.getElementById('slotCount').textContent = slotTotal ? `(${slotTotal})` : '';
        }

            const list = data.items.filter(i => i.type === 'feeling' && !i.done);
            document.getElementById('feelingCount').textContent = list.length ? `(${list.length})` : '';

            list.forEach(item => container.appendChild(renderItem(item, {showCheckbox: false})));

        function renderToday() {
            const container = document.getElementById('todayList');
            container.innerHTML = '';
            const list = data.items.filter(i => {
                if (i.type === 'task' && !i.done && !i.placedIn) {
                    if (i.unknown) {

                    }
                    return true;
                }

            });
            document.getElementById('todayCount').textContent = list.length ? `(${list.length})` : '';

                container.innerHTML = '<div class="empty-tip">暂无待办任务</div>';

            const container = document.getElementById('doneList');
            container.innerHTML = '';
            const list = data.items.filter(i => i.done && isToday(i.doneAt || i.updatedAt));
            document.getElementById('doneCount').textContent = list.length ? `(${list.length})` : '';
            if (list.length === 0) {
                container.innerHTML = '<div class="empty-tip">今天还没有完成的事项</div>';
                return;
            }
            list.forEach(item => container.appendChild(renderItem(item, {showCheckbox:true})));
        }

        function renderHistory() {
            const container = document.getElementById('historyContent');
            container.innerHTML = '';
            const list = data.items.filter(i => {
                if (i.done && isToday(i.doneAt || i.updatedAt)) return false;
                return isBeforeToday(i.createdAt);
            });
            document.getElementById('historyCount').textContent = list.length ? `(${list.length})` : '';
            if (list.length === 0) {
                container.innerHTML = '<div class="empty-tip">没有往期记录</div>';
                return;

            list.forEach(item => container.appendChild(renderItem(item, {showCheckbox: item.type==='task'})));

            if (!name) return;

        function deleteSlot(id) {
            if (!confirm('删除这个时间段？其中的任务会回到待办。')) return;
            data.slots = data.slots.filter(s => s.id !== id);
            data.items.forEach(i => {
                if (i.type === 'task') {
                    if (i.placedIn === id) delete i.placedIn;
                    if (i.subtasks) i.subtasks.forEach(st => { if (st.placedIn === id) st.placedIn = null; });
                }
            });
            saveData(); render();
        }

        function showPlaceMenu(e, itemId, subId) {
            const existing = document.querySelector('.place-select-overlay');
            if (existing) existing.remove();
            const menu = document.createElement('div');
            menu.className = 'place-select-overlay';
            data.slots.forEach(slot => {
                const opt = document.createElement('div');
                opt.className = 'place-option';
                opt.textContent = slot.name;
                opt.onclick = () => {
                    const item = data.items.find(i => i.id === itemId);
                    if (item && item.subtasks) {
                        const st = item.subtasks.find(s => s.id === subId);
                        if (st) st.placedIn = slot.id;
                        item.updatedAt = nowStr();
                        saveData(); render();
                    }
                    menu.remove();
                };
                menu.appendChild(opt);
            });
            document.body.appendChild(menu);
            const rect = e.target.getBoundingClientRect();
            menu.style.top = (rect.bottom + window.scrollY) + 'px';
            menu.style.left = (rect.left + window.scrollX) + 'px';
            setTimeout(() => {
                document.addEventListener('click', function handler(ev) {
                    if (!menu.contains(ev.target)) { menu.remove(); document.removeEventListener('click', handler); }
                }, {once:true});
            }, 10);
        }

        function removeFromSlot(itemId, subId) {
            const item = data.items.find(i => i.id === itemId);
            if (item && item.subtasks) {
                const st = item.subtasks.find(s => s.id === subId);
                if (st) st.placedIn = null;
                item.updatedAt = nowStr();

        function utf8ToBase64(str) {
            try {
                const bytes = new TextEncoder().encode(str);
                let binary = '';
                const len = bytes.byteLength;
                for (let i = 0; i < len; i++) {
                    binary += String.fromCharCode(bytes[i]);
                }
                return btoa(binary);
            } catch (e) {
                return btoa(unescape(encodeURIComponent(str)));
            }
        }

        async function pushToGithub() {
            if (!data.github) { showGithubConfig(); return; }
            const {username, repo, token} = data.github;
            const path = 'mindtodo-data.json';
            // 创建要推送的数据副本，移除敏感信息
            const dataToPush = {
                items: data.items,
                slots: data.slots,
                tags: data.tags,
                commonTags: data.commonTags,
                title: data.title,
                github: {
                    username: data.github.username,
                    repo: data.github.repo,
                    issue: data.github.issue,
                    lastSync: data.github.lastSync
                    // 不包含 token
                }
            };
            const content = utf8ToBase64(JSON.stringify(dataToPush, null, 2));
            const api = `https://api.github.com/repos/${username}/${repo}/contents/${path}`;
            let sha = null;
            let getStatus = null;
            try {
                const getRes = await fetch(api, {headers: {Authorization: `token ${token}`}});
                getStatus = getRes.status;
                if (getRes.status === 401) { alert('Token 已过期，请重新配置'); showGithubConfig(); return; }
                if (getRes.ok) { const info = await getRes.json(); sha = info.sha; }
            } catch(e) {}
            const issue = data.github.issue || '';
            const message = issue ? `update mindtodo data (issue #${issue})` : 'update mindtodo data';
            const body = {message, content};
            if (sha) body.sha = sha;
            try {
                const res = await fetch(api, {
                    method: 'PUT',
                    headers: {'Authorization': `token ${token}`, 'Content-Type': 'application/json'},
                    body: JSON.stringify(body)
                });
                if (res.status === 401 || res.status === 403) { alert('Token 无效或已过期，请重新配置'); showGithubConfig(); return; }
                if (res.status === 409) {
                    const reason = sha
                        ? '文件可能已被其他设备修改，sha 不匹配。'
                        : '仓库可能尚未初始化（没有 README 或任何提交）。请先在 GitHub 仓库中手动创建一个文件，或在创建仓库时勾选"Initialize this repository with a README"。';
                    alert('推送失败 (409 Conflict)\n\n可能原因：' + reason);
                    return;
                }
                if (res.status === 422) {
                    const err = await res.json().catch(() => ({}));
                    alert('推送失败 (422)：' + (err.message || '请求格式错误'));
                    return;
                }
                if (res.ok) {
                    data.github.lastSync = nowStr();
                    saveData();
                    alert('推送成功');
                    checkUpdateStatus();
                } else {
                    alert('推送失败: HTTP ' + res.status);
                }
            } catch(e) {
                alert('网络错误，请检查网络连接');
            }
        }

        function base64ToUtf8(str) {
            try {
                const binary = atob(str);
                const bytes = new Uint8Array(binary.length);
                for (let i = 0; i < binary.length; i++) {
                    bytes[i] = binary.charCodeAt(i);
                }
                return new TextDecoder().decode(bytes);
            } catch (e) {
                return decodeURIComponent(escape(atob(str)));
            }
        }

        async function pullFromGithub(manual=false) {
            if (!data.github) { if (manual) showGithubConfig(); return; }
            if (!manual && data.firstLoaded) return;
            const {username, repo, token} = data.github;
            const path = 'mindtodo-data.json';
            try {
                const res = await fetch(`https://api.github.com/repos/${username}/${repo}/contents/${path}`, {
                    headers: {Authorization: `token ${token}`}
                });
                if (res.status === 401) {
                    alert('Token 已过期，请重新配置');
                    if (manual) showGithubConfig();
                    else { data.github = null; saveData(); }
                    return;
                }
                if (res.status === 404) {
                    if (manual) alert('远程暂无数据文件');
                    data.firstLoaded = true; saveData(); return;
                }
                if (res.status === 409) {
                    alert('拉取失败 (409)：仓库可能尚未初始化，请在 GitHub 上先创建 README。');
                    return;
                }
                if (!res.ok) {
                    if (manual) alert('拉取失败: HTTP ' + res.status);
                    data.firstLoaded = true; saveData(); return;
                }
                const info = await res.json();
                const json = base64ToUtf8(info.content);
                const remote = JSON.parse(json);
                if (remote.items) data.items = remote.items;
                if (remote.slots) data.slots = remote.slots;
                if (remote.tags) data.tags = remote.tags;
                if (remote.commonTags) data.commonTags = remote.commonTags;
                if (remote.title) data.title = remote.title;
                // 不覆盖本地的 github.token 配置
                if (remote.github) {
                    if (remote.github.username) data.github.username = remote.github.username;
                    if (remote.github.repo) data.github.repo = remote.github.repo;
                    if (remote.github.issue !== undefined) data.github.issue = remote.github.issue;
                    if (remote.github.lastSync) data.github.lastSync = remote.github.lastSync;
                }
                data.firstLoaded = true;
                saveData();
                applyTitle();
                render();
                if (manual) alert('拉取成功');
            } catch(e) {
                if (manual) alert('拉取失败: ' + (e.message || '网络错误'));
                data.firstLoaded = true;
                saveData();
            }
        }

        // ============ Helper Functions ============
        function checkUpdateStatus() {
            const banner = document.getElementById('updateBanner');
            if (!data.github || !data.github.lastSync) {
                banner.classList.remove('show');
                return;
            }
            const lastSync = new Date(data.github.lastSync);
            const lastUpdate = new Date(data.items.reduce((max, item) => {
                const itemTime = new Date(item.updatedAt);
                return itemTime > max ? itemTime : max;
            }, new Date(0)));
            if (lastUpdate > lastSync) {
                banner.classList.add('show');
            } else {
                banner.classList.remove('show');
            }
        }

        // ============ Init ============
        loadData();
        initVoice();
        selectType('feeling');
        applyTitle();
        updateGithubStatus();
        render();
        pullFromGithub();
    </script>
</body>
</html>

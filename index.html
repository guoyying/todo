        // ============ Actions ============
        function toggleDone(id) {
            const item = data.items.find(i => i.id === id);
            if (!item) return;
            item.done = !item.done;
            item.doneAt = item.done ? nowStr() : null;
            item.updatedAt = nowStr();
            saveData(); render();
        }

        function toggleSubtask(itemId, subId) {
            const item = data.items.find(i => i.id === itemId);
            if (!item || !item.subtasks) return;
            const st = item.subtasks.find(s => s.id === subId);
            if (!st) return;
            st.done = !st.done;
            item.updatedAt = nowStr();
            saveData(); render();
        }

        function toggleSubtaskDone(itemId, subId) {
            toggleSubtask(itemId, subId);
        }

        function deleteItem(id) {
            if (!confirm('确定要删除吗？')) return;
            data.items = data.items.filter(i => i.id !== id);
            saveData(); render();
        }

        function openEdit(id) {
            const item = data.items.find(i => i.id === id);
            if (!item) return;
            editingId = id;
            document.getElementById('editContent').value = item.content;
            document.getElementById('editModal').classList.remove('hidden');
        }

        function closeEditModal() {
            document.getElementById('editModal').classList.add('hidden');
            editingId = null;
        }

        function saveEdit() {
            const item = data.items.find(i => i.id === editingId);
            if (!item) return;
            item.content = document.getElementById('editContent').value;
            item.updatedAt = nowStr();
            saveData(); render();
            closeEditModal();
        }

        function addSlot() {
            const input = document.getElementById('newSlotName');
            const name = input.value.trim();
            if (!name) return;
            data.slots.push({id: 'slot_' + genId(), name});
            input.value = '';
            saveData(); render();
        }
        
        // 添加回车键事件
        document.getElementById('newSlotName').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                addSlot();
            }
        });

        function deleteSlot(id) {
            if (!confirm('删除这个时间段？其中的任务会回到待办。')) return;
            data.slots = data.slots.filter(s => s.id !== id);
            data.items.forEach(i => {
                if (i.type === 'task') {
                    if (i.placedIn === id) delete i.placedIn;
                    if (i.subtasks) i.subtasks.forEach(st => { if (st.placedIn === id) st.placedIn = null; });
                }
            });
            saveData(); render();
        }

        function showPlaceMenu(e, itemId, subId) {
            const existing = document.querySelector('.place-select-overlay');
            if (existing) existing.remove();
            const menu = document.createElement('div');
            menu.className = 'place-select-overlay';
            data.slots.forEach(slot => {
                const opt = document.createElement('div');
                opt.className = 'place-option';
                opt.textContent = slot.name;
                opt.onclick = () => {
                    const item = data.items.find(i => i.id === itemId);
                    if (item && item.subtasks) {
                        const st = item.subtasks.find(s => s.id === subId);
                        if (st) st.placedIn = slot.id;
                        item.updatedAt = nowStr();
                        saveData(); render();
                    }
                    menu.remove();
                };
                menu.appendChild(opt);
            });
            document.body.appendChild(menu);
            const rect = e.target.getBoundingClientRect();
            menu.style.top = (rect.bottom + window.scrollY) + 'px';
            menu.style.left = (rect.left + window.scrollX) + 'px';
            setTimeout(() => {
                document.addEventListener('click', function handler(ev) {
                    if (!menu.contains(ev.target)) { menu.remove(); document.removeEventListener('click', handler); }
                }, {once:true});
            }, 10);
        }

        function removeFromSlot(itemId, subId) {
            const item = data.items.find(i => i.id === itemId);
            if (item && item.subtasks) {
                const st = item.subtasks.find(s => s.id === subId);
                if (st) {
                    // 保存撤销信息
                    data.lastUndo = { type: 'sub', itemId, subId, slotId: st.placedIn };
                    st.placedIn = null;
                    item.updatedAt = nowStr();
                    saveData(); render();
                    // 显示气泡提示
                    showUndoToast('sub', itemId, subId);
                }
            }
        }

        function undoRemoveFromSlot(kind, itemId, subId, slotId) {
            if (kind === 'sub') {
                const item = data.items.find(i => i.id === itemId);
                if (item && item.subtasks) {
                    const st = item.subtasks.find(s => s.id === subId);
                    if (st) {
                        st.placedIn = slotId;
                        item.updatedAt = nowStr();
                        saveData(); render();
                    }
                }
            } else if (kind === 'item') {
                const item = data.items.find(i => i.id === itemId);
                if (item) {
                    item.placedIn = slotId;
                    item.updatedAt = nowStr();
                    saveData(); render();
                }
            }
        }

        // 显示撤销提示气泡
        let undoToastTimer = null;
        function showUndoToast(type, itemId, subId) {
            const toast = document.getElementById('undoToast');
            const messageEl = document.getElementById('undoToastMessage');
            const btn = document.getElementById('undoToastBtn');
            
            messageEl.textContent = '已返回待办，点击撤销恢复';
            toast.classList.remove('hidden');
            
            // 清除之前的定时器
            if (undoToastTimer) clearTimeout(undoToastTimer);
            
            // 设置撤销按钮点击事件
            btn.onclick = () => {
                undoRemoveFromSlot(type, itemId, subId, data.lastUndo?.slotId);
                toast.classList.add('hidden');
            };
            
            // 5 秒后自动消失
            undoToastTimer = setTimeout(() => {
                toast.classList.add('hidden');
            }, 5000);
        }

        function showTaskPlaceMenu(e, itemId) {
            const existing = document.querySelector('.place-select-overlay');
            if (existing) existing.remove();
            const menu = document.createElement('div');
            menu.className = 'place-select-overlay';
            data.slots.forEach(slot => {
                const opt = document.createElement('div');
                opt.className = 'place-option';
                opt.textContent = slot.name;
                opt.onclick = () => {
                    const item = data.items.find(i => i.id === itemId);
                    if (item) {
                        item.placedIn = slot.id;
                        item.updatedAt = nowStr();
                        saveData(); render();
                    }
                    menu.remove();
                };
                menu.appendChild(opt);
            });
            document.body.appendChild(menu);
            const rect = e.target.getBoundingClientRect();
            menu.style.top = (rect.bottom + window.scrollY) + 'px';
            menu.style.left = (rect.left + window.scrollX) + 'px';
            setTimeout(() => {
                document.addEventListener('click', function handler(ev) {
                    if (!menu.contains(ev.target)) { menu.remove(); document.removeEventListener('click', handler); }
                }, {once:true});
            }, 10);
        }

        function removeFromSlotSimple(itemId) {
            const item = data.items.find(i => i.id === itemId);
            if (item) {
                // 保存撤销信息
                data.lastUndo = { type: 'item', itemId, slotId: item.placedIn };
                item.placedIn = null;
                item.updatedAt = nowStr();
                saveData(); render();
                // 显示气泡提示
                showUndoToast('item', itemId, null);
            }
        }
        
        function showTagEditor(itemId, currentTag, type) {
            const item = data.items.find(i => i.id === itemId);
            if (!item) return;
            
            const modal = document.createElement('div');
            modal.className = 'modal-overlay';
            modal.innerHTML = `
                <div class="modal">
                    <h3>${currentTag ? '编辑标签' : '添加标签'}</h3>
                    <div class="input-group">
                        <label>标签名称</label>
                        <input type="text" id="tagEditorInput" placeholder="输入标签名称" value="${currentTag || ''}">
                    </div>
                    <div class="modal-actions">
                        <button class="btn btn-secondary" onclick="this.closest('.modal-overlay').remove()">取消</button>
                        <button class="btn btn-primary" onclick="saveTagEdit('${itemId}', '${type}')">保存</button>
                        ${currentTag ? `<button class="btn btn-danger" onclick="deleteTagFromItem('${itemId}', '${currentTag}')">删除</button>` : ''}
                    </div>
                </div>
            `;
            document.body.appendChild(modal);
            setTimeout(() => {
                document.getElementById('tagEditorInput').focus();
            }, 10);
        }
        
        function saveTagEdit(itemId, type) {
            const item = data.items.find(i => i.id === itemId);
            if (!item) return;
            
            const input = document.getElementById('tagEditorInput');
            const newTag = input.value.trim();
            const modal = input.closest('.modal-overlay');
            
            if (!newTag) {
                modal.remove();
                return;
            }
            
            if (!data.tags.includes(newTag)) {
                data.tags.push(newTag);
            }
            
            if (type === 'task') {
                if (!item.tags) item.tags = [];
                const idx = item.tags.indexOf(newTag);
                if (idx === -1) item.tags.push(newTag);
            } else {
                if (!item.tags) item.tags = [];
                const idx = item.tags.indexOf(newTag);
                if (idx === -1) item.tags.push(newTag);
            }
            
            item.updatedAt = nowStr();
            saveData(); render();
            modal.remove();
        }
        
        function deleteTagFromItem(itemId, tag) {
            const item = data.items.find(i => i.id === itemId);
            if (!item) return;
            
            item.tags = item.tags.filter(t => t !== tag);
            item.updatedAt = nowStr();
            saveData(); render();
            document.querySelector('.modal-overlay')?.remove();
        }
        
        function showFeelingEditor(itemId) {
            const item = data.items.find(i => i.id === itemId);
            if (!item) return;
            
            const modal = document.createElement('div');
            modal.className = 'modal-overlay';
            modal.innerHTML = `
                <div class="modal">
                    <h3>编辑感受</h3>
                    <div class="input-group">
                        <label>感受内容</label>
                        <textarea id="feelingEditorContent" rows="4">${item.content}</textarea>
                    </div>
                    <div class="input-group">
                        <label>标签</label>
                        <div class="tags-select" id="feelingEditorTags"></div>
                    </div>
                    <div class="modal-actions">
                        <button class="btn btn-secondary" onclick="this.closest('.modal-overlay').remove()">取消</button>
                        <button class="btn btn-primary" onclick="saveFeelingEdit('${itemId}')">保存</button>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);
            
            // 渲染标签选择器
            setTimeout(() => {
                const container = document.getElementById('feelingEditorTags');
                container.innerHTML = '';
                const allTags = [...new Set([...data.tags, ...data.commonTags])];
                allTags.forEach(tag => {
                    const span = document.createElement('span');
                    span.className = 'tag' + (item.tags && item.tags.includes(tag) ? ' active' : '');
                    const text = document.createElement('span');
                    text.textContent = tag;
                    text.onclick = (e) => {
                        e.stopPropagation();
                        span.classList.toggle('active');
                    };
                    const del = document.createElement('span');
                    del.className = 'tag-del';
                    del.textContent = '×';
                    del.title = '删除标签';
                    del.onclick = (e) => {
                        e.stopPropagation();
                        deleteTag(tag);
                    };
                    span.appendChild(text);
                    span.appendChild(del);
                    container.appendChild(span);
                });
                
                const editor = document.createElement('div');
                editor.className = 'tag-editor';
                editor.innerHTML = `<input type="text" placeholder="新标签" id="feelingEditorNewTag"><button class="btn btn-small btn-secondary" onclick="addTagToFeelingEditor('${itemId}')">添加</button>`;
                container.appendChild(editor);
            }, 10);
        }
        
        function saveFeelingEdit(itemId) {
            const item = data.items.find(i => i.id === itemId);
            if (!item) return;
            
            const content = document.getElementById('feelingEditorContent').value.trim();
            if (!content) return;
            
            item.content = content;
            
            // 获取选中的标签
            const selectedTags = Array.from(document.querySelectorAll('#feelingEditorTags .tag.active')).map(el => {
                return el.querySelector('span').textContent;
            });
            item.tags = selectedTags;
            
            item.updatedAt = nowStr();
            saveData(); render();
            document.querySelector('.modal-overlay')?.remove();
        }
        
        function addTagToFeelingEditor(itemId) {
            const input = document.getElementById('feelingEditorNewTag');
            const newTag = input.value.trim();
            if (!newTag) return;
            
            if (!data.tags.includes(newTag)) {
                data.tags.push(newTag);
            }
            
            // 重新渲染标签选择器
            showFeelingEditor(itemId);
            saveData();
        }

        function toggleHistory() {
            const content = document.getElementById('historyContent');
            const arrow = document.getElementById('historyArrow');
            content.classList.toggle('hidden');
            arrow.textContent = content.classList.contains('hidden') ? '▶' : '▼';
        }

        function toggleOldSection(section) {
            const list = document.getElementById(section === 'oldTodo' ? 'oldTodoList' : 'oldFeelingList');
            const filterBar = document.getElementById(section === 'oldTodo' ? 'oldTodoFilterBar' : 'oldFeelingFilterBar');
            const arrow = document.getElementById(section === 'oldTodo' ? 'oldTodoArrow' : 'oldFeelingArrow');
            
            const isHidden = list.classList.contains('old-section-collapsed');
            if (isHidden) {
                list.classList.remove('old-section-collapsed');
                filterBar.classList.remove('old-section-collapsed');
                arrow.textContent = '▼';
            } else {
                list.classList.add('old-section-collapsed');
                filterBar.classList.add('old-section-collapsed');
                arrow.textContent = '▶';
            }
        }

        // ============ GitHub ============
        function showGithubConfig() {
            const g = data.github || {};
            document.getElementById('ghUsername').value = g.username || '';
            document.getElementById('ghRepo').value = g.repo || '';
            document.getElementById('ghIssue').value = g.issue || '';
            document.getElementById('ghToken').value = g.token || '';
            document.getElementById('githubModal').classList.remove('hidden');
        }

        function closeGithubModal() {
            document.getElementById('githubModal').classList.add('hidden');
        }

        function saveGithubConfig() {
            const username = document.getElementById('ghUsername').value.trim();
            const repo = document.getElementById('ghRepo').value.trim();
            const issue = document.getElementById('ghIssue').value.trim();
            const token = document.getElementById('ghToken').value.trim();
            if (!username || !repo || !token) {
                alert('请填写完整');
                return;
            }
            data.github = {username, repo, issue, token, lastSync: null};
            saveData();
            closeGithubModal();
            updateGithubStatus();
        }

        function updateGithubStatus() {
            const el = document.getElementById('githubStatus');
            if (!data.github) {
                el.textContent = '未配置';
                return;
            }
            el.textContent = `已配置: ${data.github.repo}`;
        }

        function applyTitle() {
            const title = data.title || '🌿 心事与任务';
            document.getElementById('pageTitle').textContent = title;
            document.title = title.replace(/^\S+\s*/, '');
        }

        function showPageSettings() {
            document.getElementById('settingTitle').value = (data.title || '🌿 心事与任务').replace(/^\S+\s*/, '');
            document.getElementById('pageSettingsModal').classList.remove('hidden');
        }

        function closePageSettings() {
            document.getElementById('pageSettingsModal').classList.add('hidden');
        }

        function savePageSettings() {
            const titleInput = document.getElementById('settingTitle').value.trim();
            data.title = (titleInput ? '🌿 ' + titleInput : '🌿 心事与任务');
            saveData();
            applyTitle();
            render();
            closePageSettings();
        }

        function utf8ToBase64(str) {
            try {
                const bytes = new TextEncoder().encode(str);
                let binary = '';
                const len = bytes.byteLength;
                for (let i = 0; i < len; i++) {
                    binary += String.fromCharCode(bytes[i]);
                }
                return btoa(binary);
            } catch (e) {
                return btoa(unescape(encodeURIComponent(str)));
            }
        }

        async function pushToGithub() {
            if (!data.github) { showGithubConfig(); return; }
            const {username, repo, token} = data.github;
            const path = 'mindtodo-data.json';
            // 创建要推送的数据副本，移除敏感信息
            const dataToPush = {
                items: data.items,
                slots: data.slots,
                tags: data.tags,
                commonTags: data.commonTags,
                title: data.title,
                github: {
                    username: data.github.username,
                    repo: data.github.repo,
                    issue: data.github.issue,
                    lastSync: data.github.lastSync
                    // 不包含 token
                }
            };
            const content = utf8ToBase64(JSON.stringify(dataToPush, null, 2));
            const api = `https://api.github.com/repos/${username}/${repo}/contents/${path}`;
            let sha = null;
            let getStatus = null;
            try {
                const getRes = await fetch(api, {headers: {Authorization: `token ${token}`}});
                getStatus = getRes.status;
                if (getRes.status === 401) {
                    showBanner('❌ Token 已过期，请重新配置', '#f44336', 3000);
                    showGithubConfig();
                    return;
                }
                if (getRes.ok) { const info = await getRes.json(); sha = info.sha; }
            } catch(e) {}
            const issue = data.github.issue || '';
            const message = issue ? `update mindtodo data (issue #${issue})` : 'update mindtodo data';
            const body = {message, content};
            if (sha) body.sha = sha;
            try {
                const res = await fetch(api, {
                    method: 'PUT',
                    headers: {'Authorization': `token ${token}`, 'Content-Type': 'application/json'},
                    body: JSON.stringify(body)
                });
                if (res.status === 401 || res.status === 403) {
                    showBanner('❌ Token 无效或已过期，请重新配置', '#f44336', 3000);
                    showGithubConfig();
                    return;
                }
                if (res.status === 409) {
                    const reason = sha
                        ? '文件可能已被其他设备修改，sha 不匹配。'
                        : '仓库可能尚未初始化（没有 README 或任何提交）。请先在 GitHub 仓库中手动创建一个文件，或在创建仓库时勾选"Initialize this repository with a README"。';
                    showBanner('❌ 推送失败 (409): ' + reason, '#f44336', 5000);
                    return;
                }
                if (res.status === 422) {
                    const err = await res.json().catch(() => ({}));
                    showBanner('❌ 推送失败 (422): ' + (err.message || '请求格式错误'), '#f44336', 3000);
                    return;
                }
                if (res.ok) {
                    data.github.lastSync = nowStr();
                    saveData();
                    checkUpdateStatus();
                    // 推送成功后自动隐藏提示
                    setTimeout(() => {
                        const banner = document.getElementById('updateBanner');
                        if (banner) banner.classList.remove('show');
                    }, 100);
                    // 显示成功气泡，自动消失
                    showBanner('✅ 推送成功！', '#4caf50', 2000);
                } else {
                    // 显示失败气泡，自动消失
                    showBanner('❌ 推送失败：HTTP ' + res.status, '#f44336', 3000);
                }
            } catch(e) {
                showBanner('❌ 网络错误，请检查网络连接', '#f44336', 3000);
            }
        }

        async function pushHtmlToGithub(input) {
            if (!data.github) {
                alert('请先配置 GitHub 信息');
                showGithubConfig();
                input.value = '';
                return;
            }

            const file = input.files[0];
            if (!file) {
                input.value = '';
                return;
            }

            if (!file.name.endsWith('.html')) {
                alert('请选择 HTML 文件');
                input.value = '';
                return;
            }

            const reader = new FileReader();
            reader.onload = async function(e) {
                const htmlContent = e.target.result;
                const {username, repo, token} = data.github;
                const path = 'index.html';
                const content = utf8ToBase64(htmlContent);
                const api = `https://api.github.com/repos/${username}/${repo}/contents/${path}`;
                
                let sha = null;
                try {
                    const getRes = await fetch(api, {headers: {Authorization: `token ${token}`}});
                    if (getRes.ok) {
                        const info = await getRes.json();
                        sha = info.sha;
                    }
                } catch(e) {}

                const body = {
                    message: `update index.html (v${data.github.version || 0 + 1})`,
                    content
                };
                if (sha) body.sha = sha;

                try {
                    const res = await fetch(api, {
                        method: 'PUT',
                        headers: {'Authorization': `token ${token}`, 'Content-Type': 'application/json'},
                        body: JSON.stringify(body)
                    });

                    if (res.status === 401 || res.status === 403) {
                        showBanner('❌ Token 无效或已过期，请重新配置', '#f44336', 3000);
                        showGithubConfig();
                        input.value = '';
                        return;
                    }

                    if (res.status === 409) {
                        showBanner('❌ 推送失败：文件冲突，请刷新页面后重试', '#f44336', 3000);
                        input.value = '';
                        return;
                    }

                    if (res.ok) {
                        // 增加版本号
                        if (!data.github.version) data.github.version = 1;
                        data.github.version++;
                        data.github.lastSync = nowStr();
                        saveData();
                        
                        showBanner('✅ HTML 推送成功！请等待 1-2 分钟让 GitHub Pages 更新', '#4caf50', 4000);
                        input.value = '';
                    } else {
                        showBanner('❌ 推送失败：HTTP ' + res.status, '#f44336', 3000);
                        input.value = '';
                    }
                } catch(e) {
                    showBanner('❌ 网络错误，请检查网络连接', '#f44336', 3000);
                    input.value = '';
                }
            };
            reader.readAsText(file);
        }

        function showBanner(message, color, duration) {
            const banner = document.createElement('div');
            banner.className = 'update-banner show';
            banner.style.backgroundColor = color;
            banner.innerHTML = message;
            document.body.insertBefore(banner, document.body.firstChild);
            setTimeout(() => {
                banner.remove();
            }, duration);
        }

        function base64ToUtf8(str) {
            try {
                const binary = atob(str);
                const bytes = new Uint8Array(binary.length);
                for (let i = 0; i < binary.length; i++) {
                    bytes[i] = binary.charCodeAt(i);
                }
                return new TextDecoder().decode(bytes);
            } catch (e) {
                return decodeURIComponent(escape(atob(str)));
            }
        }

        async function pullFromGithub(manual=false) {
            if (!data.github) { if (manual) showGithubConfig(); return; }
            if (!manual && data.firstLoaded) return;
            const {username, repo, token} = data.github;
            const path = 'mindtodo-data.json';
            try {
                // 添加版本号参数强制刷新缓存
                const cacheBuster = data.github.version ? '?v=' + data.github.version : '';
                const res = await fetch(`https://api.github.com/repos/${username}/${repo}/contents/${path}${cacheBuster}`, {
                    headers: {Authorization: `token ${token}`}
                });
                if (res.status === 401) {
                    alert('Token 已过期，请重新配置');
                    if (manual) showGithubConfig();
                    else { data.github = null; saveData(); }
                    return;
                }
                if (res.status === 404) {
                    if (manual) alert('远程暂无数据文件');
                    data.firstLoaded = true; saveData(); return;
                }
                if (res.status === 409) {
                    alert('拉取失败 (409)：仓库可能尚未初始化，请在 GitHub 上先创建 README。');
                    return;
                }
                if (!res.ok) {
                    if (manual) alert('拉取失败: HTTP ' + res.status);
                    data.firstLoaded = true; saveData(); return;
                }
                const info = await res.json();
                const json = base64ToUtf8(info.content);
                const remote = JSON.parse(json);
                if (remote.items) data.items = remote.items;
                if (remote.slots) data.slots = remote.slots;
                if (remote.tags) data.tags = remote.tags;
                if (remote.commonTags) data.commonTags = remote.commonTags;
                if (remote.title) data.title = remote.title;
                // 不覆盖本地的 github.token 配置
                if (remote.github) {
                    if (remote.github.username) data.github.username = remote.github.username;
                    if (remote.github.repo) data.github.repo = remote.github.repo;
                    if (remote.github.issue !== undefined) data.github.issue = remote.github.issue;
                    if (remote.github.lastSync) data.github.lastSync = remote.github.lastSync;
                    if (remote.github.version) data.github.version = remote.github.version;
                }
                data.firstLoaded = true;
                saveData();
                applyTitle();
                render();
                if (manual) alert('拉取成功');
            } catch(e) {
                if (manual) alert('拉取失败: ' + (e.message || '网络错误'));
                data.firstLoaded = true;
                saveData();
            }
        }

        // ============ Helper Functions ============
        function checkUpdateStatus() {
            const banner = document.getElementById('updateBanner');
            if (!data.github || !data.github.lastSync) {
                banner.classList.remove('show');
                return;
            }
            const lastSync = new Date(data.github.lastSync);
            const lastUpdate = new Date(data.items.reduce((max, item) => {
                const itemTime = new Date(item.updatedAt);
                return itemTime > max ? itemTime : max;
            }, new Date(0)));
            if (lastUpdate > lastSync) {
                banner.classList.add('show');
            } else {
                banner.classList.remove('show');
            }
        }

        // ============ Init ============
        loadData();
        initVoice();
        selectType('feeling');
        applyTitle();
        updateGithubStatus();
        render();
        pullFromGithub();
    </script>

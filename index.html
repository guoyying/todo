        // ============ Actions ============
        function toggleDone(id) {
            const item = data.tasks.find(i => i.id === id);
            if (!item) return;
            item.done = !item.done;
            item.doneAt = item.done ? nowStr() : null;
            item.updatedAt = nowStr();
            saveData(); render();
        }

        function toggleSubtask(itemId, subId) {
            const item = data.tasks.find(i => i.id === itemId);
            if (!item || !item.subtasks) return;
            const st = item.subtasks.find(s => s.id === subId);
            if (!st) return;
            st.done = !st.done;
            item.updatedAt = nowStr();
            saveData(); render();
        }

        function toggleSubtaskDone(itemId, subId) {
            toggleSubtask(itemId, subId);
        }

        function deleteItem(id, btnElement) {
            // 安全检查：确保 btnElement 存在且有 parentElement
            if (!btnElement || !btnElement.parentElement) {
                // 如果按钮元素无效，使用传统的 confirm 弹窗
                if (!confirm('确定要删除这个任务吗？')) return;
                data.tasks = data.tasks.filter(i => i.id !== id);
                saveData();
                render();
                return;
            }
            
            // 在删除按钮旁边显示确认提示
            const container = btnElement.parentElement;
            // 检查是否已经有确认提示，避免重复添加
            if (container.querySelector('.delete-confirm')) return;
            
            const confirmDiv = document.createElement('div');
            confirmDiv.className = 'delete-confirm';
            confirmDiv.innerHTML = `
                <span>确定要删除吗？</span>
                <button class="btn btn-small btn-danger" onclick="confirmDelete('${id}', this)">确认</button>
                <button class="btn btn-small btn-secondary" onclick="this.parentElement.remove()">取消</button>
            `;
            container.appendChild(confirmDiv);
            
            // 3 秒后自动消失
            setTimeout(() => {
                if (confirmDiv.parentElement) {
                    confirmDiv.remove();
                }
            }, 3000);
        }

        function confirmDelete(id, btnElement) {
            data.tasks = data.tasks.filter(i => i.id !== id);
            saveData();
            render();
            showBanner('任务已删除', 'error');
        }

        function openEdit(id) {
            const item = data.tasks.find(i => i.id === id);
            if (!item) return;
            editingId = id;
            document.getElementById('editContent').value = item.content;
            document.getElementById('editModal').classList.remove('hidden');
        }

        function closeEditModal() {
            document.getElementById('editModal').classList.add('hidden');
            editingId = null;
        }

        function saveEdit() {
            const item = data.tasks.find(i => i.id === editingId);
            if (!item) return;
            item.content = document.getElementById('editContent').value;
            item.updatedAt = nowStr();
            saveData(); render();
            closeEditModal();
        }

        function addSlot() {
            const input = document.getElementById('newSlotName');
            const name = input.value.trim();
            if (!name) return;
            data.slots.push({id: 'slot_' + genId(), name});
            input.value = '';
            saveData(); render();
        }
        
        // 添加回车键事件
        document.getElementById('newSlotName').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                addSlot();
            }
        });

        function deleteSlot(id) {
            if (!confirm('删除这个时间段？其中的任务会回到待办。')) return;
            data.slots = data.slots.filter(s => s.id !== id);
            data.tasks.forEach(i => {
                if (i.placedIn === id) delete i.placedIn;
                if (i.subtasks) {
                    i.subtasks.forEach(st => {
                        if (st.placedIn === id) st.placedIn = null;
                    });
                }
            });
            saveData(); render();
        }

        function showPlaceMenu(e, itemId, subId) {
            const existing = document.querySelector('.place-select-overlay');
            if (existing) existing.remove();
            const menu = document.createElement('div');
            menu.className = 'place-select-overlay';
            data.slots.forEach(slot => {
                const opt = document.createElement('div');
                opt.className = 'place-option';
                opt.textContent = slot.name;
                opt.onclick = () => {
                    const item = data.tasks.find(i => i.id === itemId);
                    if (item && item.subtasks) {
                        const st = item.subtasks.find(s => s.id === subId);
                        if (st) st.placedIn = slot.id;
                        item.updatedAt = nowStr();
                        saveData(); render();
                    }
                    menu.remove();
                };
                menu.appendChild(opt);
            });
            document.body.appendChild(menu);
            const rect = e.target.getBoundingClientRect();
            menu.style.top = (rect.bottom + window.scrollY) + 'px';
            menu.style.left = (rect.left + window.scrollX) + 'px';
            setTimeout(() => {
                document.addEventListener('click', function handler(ev) {
                    if (!menu.contains(ev.target)) { menu.remove(); document.removeEventListener('click', handler); }
                }, {once:true});
            }, 10);
        }

        function removeFromSlot(itemId, subId) {
            const item = data.tasks.find(i => i.id === itemId);
            if (item && item.subtasks) {
                const st = item.subtasks.find(s => s.id === subId);
                if (st) {
                    // 保存撤销信息
                    data.lastUndo = { type: 'sub', itemId, subId, slotId: st.placedIn };
                    st.placedIn = null;
                    item.updatedAt = nowStr();
                    saveData(); render();
                    // 显示气泡提示
                    showUndoToast('sub', itemId, subId);
                }
            }
        }

        function undoRemoveFromSlot(kind, itemId, subId, slotId) {
            if (kind === 'sub') {
                const item = data.tasks.find(i => i.id === itemId);
                if (item && item.subtasks) {
                    const st = item.subtasks.find(s => s.id === subId);
                    if (st) {
                        st.placedIn = slotId;
                        item.updatedAt = nowStr();
                        saveData(); render();
                    }
                }
            } else if (kind === 'item') {
                const item = data.tasks.find(i => i.id === itemId);
                if (item) {
                    item.placedIn = slotId;
                    item.updatedAt = nowStr();
                    saveData(); render();
                }
            }
        }

        // 显示撤销提示气泡
        let undoToastTimer = null;
        function showUndoToast(type, itemId, subId) {
            const toast = document.getElementById('undoToast');
            const messageEl = document.getElementById('undoToastMessage');
            const btn = document.getElementById('undoToastBtn');
            
            messageEl.textContent = '已返回待办，点击撤销恢复';
            toast.classList.remove('hidden');
            
            // 清除之前的定时器
            if (undoToastTimer) clearTimeout(undoToastTimer);
            
            // 设置撤销按钮点击事件
            btn.onclick = () => {
                undoRemoveFromSlot(type, itemId, subId, data.lastUndo?.slotId);
                toast.classList.add('hidden');
            };
            
            // 5 秒后自动消失
            undoToastTimer = setTimeout(() => {
                toast.classList.add('hidden');
            }, 5000);
        }

        function showTagEditor(itemId, currentTag, type) {
            const item = data.tasks.find(i => i.id === itemId);
            if (!item) return;
            const modal = document.createElement('div');
            modal.className = 'modal-overlay';
            modal.innerHTML = `
                <div class="modal">
                    <h3>${currentTag ? '编辑标签' : '添加标签'}</h3>
                    <div class="input-group">
                        <label>标签名称</label>
                        <input type="text" id="tagEditorInput" placeholder="输入标签名称" value="${currentTag || ''}">
                    </div>
                    <div class="modal-actions">
                        <button class="btn btn-secondary" onclick="this.closest('.modal-overlay').remove()">取消</button>
                        <button class="btn btn-primary" onclick="saveTagEdit('${itemId}', '${type}')">保存</button>
                        ${currentTag ? `<button class="btn btn-danger" onclick="deleteTagFromItem('${itemId}', '${currentTag}')">删除</button>` : ''}
                    </div>
                </div>
            `;
            document.body.appendChild(modal);
            setTimeout(() => {
                document.getElementById('tagEditorInput').focus();
            }, 10);
        }
        
        function saveTagEdit(itemId, type) {
            const item = data.tasks.find(i => i.id === itemId);
            if (!item) return;
            const input = document.getElementById('tagEditorInput');
            const newTag = input.value.trim();
            const modal = input.closest('.modal-overlay');
            
            if (!newTag) {
                modal.remove();
                return;
            }
            
            // 添加到对应的 common 标签数组
            if (type === 'task') {
                if (!data.commonTaskTags.includes(newTag)) {
                    data.commonTaskTags.push(newTag);
                }
                if (!item.tags) item.tags = [];
                const idx = item.tags.indexOf(newTag);
                if (idx === -1) item.tags.push(newTag);
            } else {
                if (!data.commonFeelingTags.includes(newTag)) {
                    data.commonFeelingTags.push(newTag);
                }
                if (!item.tags) item.tags = [];
                const idx = item.tags.indexOf(newTag);
                if (idx === -1) item.tags.push(newTag);
            }
            
            item.updatedAt = nowStr();
            saveData(); render();
            modal.remove();
        }
        
        function deleteTagFromItem(itemId, tag) {
            const item = data.tasks.find(i => i.id === itemId);
            if (!item) return;
            item.tags = item.tags.filter(t => t !== tag);
            item.updatedAt = nowStr();
            saveData(); render();
            document.querySelector('.modal-overlay')?.remove();
        }

            const item = data.tasks.find(i => i.id === itemId);
            if (!item) return;
            const modal = document.createElement('div');
            modal.className = 'modal-overlay';
            modal.innerHTML = `
                <div class="modal">
                    <h3>编辑感受</h3>
                    <div class="input-group">
                        <label>感受内容</label>
                        <textarea id="feelingEditorContent" rows="4">${item.content}</textarea>

                        <label>标签</label>
                        <div class="tags-select" id="feelingEditorTags"></div>

                        <button class="btn btn-primary" onclick="saveFeelingEdit('${itemId}')">保存</button>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);
            
            // 渲染标签选择器
            setTimeout(() => {
                const container = document.getElementById('feelingEditorTags');
                container.innerHTML = '';
                const allTags = [...new Set([...data.tags, ...data.commonTags])];
                allTags.forEach(tag => {
                    const span = document.createElement('span');
                    span.className = 'tag' + (item.tags && item.tags.includes(tag) ? ' active' : '');
                    const text = document.createElement('span');

                        e.stopPropagation();

                    span.appendChild(del);

                const editor = document.createElement('div');

                container.appendChild(editor);
            }, 10);

        function saveFeelingEdit(itemId) {
            const item = data.tasks.find(i => i.id === itemId);
            if (!item) return;
            const content = document.getElementById('feelingEditorContent').value.trim();
            if (!content) return;
            
            item.content = content;
            
            // 获取选中的标签

                return el.querySelector('span').textContent;
            });
            item.tags = selectedTags;
            
            item.updatedAt = nowStr();
            saveData(); render();
            document.querySelector('.modal-overlay')?.remove();
        }
        
        function addTagToFeelingEditor(itemId) {
            const input = document.getElementById('feelingEditorNewTag');
            const newTag = input.value.trim();
            if (!newTag) return;
            
            if (!data.tags.includes(newTag)) {
                data.tags.push(newTag);
            }
            
            // 重新渲染标签选择器
            showFeelingEditor(itemId);
            saveData();
        }

        function utf8ToBase64(str) {
            try {
                const bytes = new TextEncoder().encode(str);
                let binary = '';
                const len = bytes.byteLength;
                for (let i = 0; i < len; i++) {
                    binary += String.fromCharCode(bytes[i]);
                }
                return btoa(binary);
            } catch (e) {
                return btoa(unescape(encodeURIComponent(str)));
            }
        }

        async function pushToGithub() {
            if (!data.github) { showGithubConfig(); return; }
            const {username, repo, token} = data.github;
            const path = 'mindtodo-data.json';
            // 创建要推送的数据副本，移除敏感信息
            const dataToPush = {
                tasks: data.tasks,
                normalFeelings: data.normalFeelings,
                practiceBlocks: data.practiceBlocks,
                slots: data.slots,
                tags: data.tags,
                commonTags: data.commonTags,
                title: data.title,
                github: {
                    username: data.github.username,
                    repo: data.github.repo,
                    issue: data.github.issue,
                    lastSync: data.github.lastSync
                    // 不包含 token
                }
            };
            const content = utf8ToBase64(JSON.stringify(dataToPush, null, 2));
            const api = `https://api.github.com/repos/${username}/${repo}/contents/${path}`;
            let sha = null;
            let getStatus = null;
            try {
                const getRes = await fetch(api, {headers: {Authorization: `token ${token}`}});
                getStatus = getRes.status;
                if (getRes.status === 401) {
                    showBanner('❌ Token 已过期，请重新配置', '#f44336', 3000);
                    showGithubConfig();
                    return;
                }
                if (getRes.ok) { const info = await getRes.json(); sha = info.sha; }
            } catch(e) {}
            const issue = data.github.issue || '';
            const message = issue ? `update mindtodo data (issue #${issue})` : 'update mindtodo data';
            const body = {message, content};
            if (sha) body.sha = sha;
            try {
                const res = await fetch(api, {
                    method: 'PUT',
                    headers: {'Authorization': `token ${token}`, 'Content-Type': 'application/json'},
                    body: JSON.stringify(body)
                });
                if (res.status === 401 || res.status === 403) {
                    showBanner('❌ Token 无效或已过期，请重新配置', '#f44336', 3000);
                    showGithubConfig();
                    return;
                }
                if (res.status === 409) {
                    const reason = sha
                        ? '文件可能已被其他设备修改，sha 不匹配。'
                        : '仓库可能尚未初始化（没有 README 或任何提交）。请先在 GitHub 仓库中手动创建一个文件，或在创建仓库时勾选"Initialize this repository with a README"。';
                    showBanner('❌ 推送失败 (409): ' + reason, '#f44336', 5000);
                    return;
                }
                if (res.status === 422) {
                    const err = await res.json().catch(() => ({}));
                    showBanner('❌ 推送失败 (422): ' + (err.message || '请求格式错误'), '#f44336', 3000);
                    return;
                }
                if (res.ok) {
                    data.github.lastSync = nowStr();
                    saveData();
                    checkUpdateStatus();
                    // 推送成功后自动隐藏提示
                    setTimeout(() => {
                        const banner = document.getElementById('updateBanner');
                        if (banner) banner.classList.remove('show');
                    }, 100);
                    // 显示成功气泡，自动消失
                    showBanner('✅ 推送成功！', '#4caf50', 2000);
                } else {
                    // 显示失败气泡，自动消失
                    showBanner('❌ 推送失败：HTTP ' + res.status, '#f44336', 3000);
                }
            } catch(e) {
                showBanner('❌ 网络错误，请检查网络连接', '#f44336', 3000);
            }
        }

        async function pushHtmlToGithub(input) {
            if (!data.github) {
                alert('请先配置 GitHub 信息');
                showGithubConfig();
                input.value = '';
                return;
            }

            const file = input.files[0];
            if (!file) {
                input.value = '';
                return;
            }

            if (!file.name.endsWith('.html')) {
                alert('请选择 HTML 文件');
                input.value = '';
                return;
            }

            const reader = new FileReader();
            reader.onload = async function(e) {
                const htmlContent = e.target.result;
                const {username, repo, token} = data.github;
                const path = 'index.html';
                const content = utf8ToBase64(htmlContent);
                const api = `https://api.github.com/repos/${username}/${repo}/contents/${path}`;
                
                let sha = null;
                try {
                    const getRes = await fetch(api, {headers: {Authorization: `token ${token}`}});
                    if (getRes.ok) {
                        const info = await getRes.json();
                        sha = info.sha;
                    }
                } catch(e) {}

                const body = {
                    message: `update index.html (v${data.github.version || 0 + 1})`,
                    content
                };
                if (sha) body.sha = sha;

                try {
                    const res = await fetch(api, {
                        method: 'PUT',
                        headers: {'Authorization': `token ${token}`, 'Content-Type': 'application/json'},
                        body: JSON.stringify(body)
                    });

                    if (res.status === 401 || res.status === 403) {
                        showBanner('❌ Token 无效或已过期，请重新配置', '#f44336', 3000);
                        showGithubConfig();
                        input.value = '';
                        return;
                    }

                    if (res.status === 409) {
                        showBanner('❌ 推送失败：文件冲突，请刷新页面后重试', '#f44336', 3000);
                        input.value = '';
                        return;
                    }

                    if (res.ok) {
                        // 增加版本号
                        if (!data.github.version) data.github.version = 1;
                        data.github.version++;
                        data.github.lastSync = nowStr();
                        saveData();
                        
                        showBanner('✅ HTML 推送成功！请等待 1-2 分钟让 GitHub Pages 更新', '#4caf50', 4000);
                        input.value = '';
                    } else {
                        showBanner('❌ 推送失败：HTTP ' + res.status, '#f44336', 3000);
                        input.value = '';
                    }
                } catch(e) {
                    showBanner('❌ 网络错误，请检查网络连接', '#f44336', 3000);
                    input.value = '';
                }
            };
            reader.readAsText(file);
        }

        function showBanner(message, color, duration = 3000) {

            banner.style.backgroundColor = color;
            banner.innerHTML = message;
            document.body.insertBefore(banner, document.body.firstChild);
            setTimeout(() => {
                banner.remove();
            }, duration);
        }

        // ============ 批量迁移功能 ============
        let migrationSelected = [];

        function showMigrationModal() {
            migrationSelected = [];
            const modal = document.getElementById('migrationModal');
            const list = document.getElementById('migrationList');
            const blockSelect = document.getElementById('blockSelect');
            
            console.log('data.normalFeelings:', data.normalFeelings);
            console.log('data.normalFeelings length:', data.normalFeelings.length);
            
            // 获取往期感受（非当天的感受）
            const oldFeelings = data.normalFeelings.filter(f => !isToday(f.createdAt));
            
            console.log('oldFeelings:', oldFeelings);
            console.log('oldFeelings length:', oldFeelings.length);
            
            if (oldFeelings.length === 0) {
                alert('没有可迁移的往期感受记录。当前共有感受：' + data.normalFeelings.length + ' 条。\n\n请检查控制台 (F12) 查看详细数据。');
                return;
            }
            
            // 生成板块列表
            blockSelect.innerHTML = '<option value="new">-- 新建板块 --</option>';
            data.practiceBlocks.forEach(block => {
                const option = document.createElement('option');
                option.value = block.id;
                option.textContent = block.name;
                blockSelect.appendChild(option);
            });
            
            // 生成迁移列表
            list.innerHTML = '';
            oldFeelings.forEach((feeling, index) => {
                const div = document.createElement('div');
                div.style.cssText = 'display:flex;align-items:center;padding:8px;border-bottom:1px solid #eee;';
                div.innerHTML = `
                    <input type="checkbox" id="mig_${index}" value="${index}" onchange="updateSelectedCount()" style="margin-right:10px;">
                    <span style="flex:1;">${feeling.content.substring(0, 50)}${feeling.content.length > 50 ? '...' : ''}</span>
                    <span style="color:#999;font-size:12px;">${fmtTime(feeling.createdAt)}</span>
                `;
                list.appendChild(div);
            });
            
            document.getElementById('selectAll').checked = false;
            document.getElementById('selectedCount').textContent = '0';
            document.getElementById('blockSelect').value = 'new';
            document.getElementById('newBlockInput').style.display = 'block'; // 默认显示新建输入框
            
            // 添加监听器：当选择板块时，控制新建输入框的显示/隐藏
            blockSelect.onchange = function() {
                const newBlockInput = document.getElementById('newBlockInput');
                if (this.value === 'new') {
                    newBlockInput.style.display = 'block';
                    document.getElementById('newBlockName').focus();
                } else {
                    newBlockInput.style.display = 'none';
                }
            };
            
            modal.classList.remove('hidden');
        }

        function closeMigrationModal() {
            document.getElementById('migrationModal').classList.add('hidden');
        }

        function toggleSelectAll() {
            const selectAll = document.getElementById('selectAll').checked;
            const checkboxes = document.querySelectorAll('#migrationList input[type="checkbox"]');
            checkboxes.forEach(cb => cb.checked = selectAll);
            updateSelectedCount();
        }

        function updateSelectedCount() {
            const checkboxes = document.querySelectorAll('#migrationList input[type="checkbox"]:checked');
            const count = checkboxes.length;
            document.getElementById('selectedCount').textContent = count;
            
            migrationSelected = Array.from(checkboxes).map(cb => parseInt(cb.value));
        }

        function toggleMigrationTarget() {
            const target = document.querySelector('input[name="migrationTarget"]:checked').value;
            const blockSelectDiv = document.getElementById('blockSelectDiv');
            
            if (target === 'block') {
                blockSelectDiv.style.display = 'block';
            } else {
                blockSelectDiv.style.display = 'none';
            }
        }

        function executeMigration() {
            if (migrationSelected.length === 0) {
                alert('请选择要迁移的记录。');
                return;
            }
            
            const target = document.querySelector('input[name="migrationTarget"]:checked').value;
            
            if (target === 'normal') {
                // 迁移到普通感受（保持现状，无需操作）
                alert(`已成功迁移 ${migrationSelected.length} 条记录到普通感受。`);
                closeMigrationModal();
                render();
                return;
            }
            
            // 迁移到板块练习
            let blockId = document.getElementById('blockSelect').value;
            let blockName = '';
            
            if (blockId === 'new') {
                blockName = document.getElementById('newBlockName').value.trim();
                if (!blockName) {
                    alert('请输入新板块名称。');
                    return;
                }
                // 创建新板块
                const newBlock = {
                    id: genId(),
                    name: blockName,
                    records: []
                };
                data.practiceBlocks.push(newBlock);
                blockId = newBlock.id;
            } else {
                const block = data.practiceBlocks.find(b => b.id === blockId);
                if (block) blockName = block.name;
            }
            
            // 迁移选中的记录
            const oldFeelings = data.normalFeelings.filter(f => !isToday(f.createdAt));
            const migratedIds = [];
            
            migrationSelected.forEach(index => {
                const feeling = oldFeelings[index];
                if (feeling) {
                    // 找到对应的板块
                    const block = data.practiceBlocks.find(b => b.id === blockId);
                    if (block) {
                        block.records.push({
                            id: genId(),
                            content: feeling.content,
                            time: feeling.createdAt,
                            estimatedTime: feeling.estimatedTime || ''
                        });
                        migratedIds.push(feeling.id);
                    }
                }
            });
            
            // 从 normalFeelings 中移除已迁移的记录
            data.normalFeelings = data.normalFeelings.filter(f => !migratedIds.includes(f.id));
            
            alert(`成功迁移 ${migratedIds.length} 条记录到板块"${blockName}"。`);
            closeMigrationModal();
            render();
            saveData();
        }

        function base64ToUtf8(str) {
            try {
                const binary = atob(str);
                const bytes = new Uint8Array(binary.length);
                for (let i = 0; i < binary.length; i++) {
                    bytes[i] = binary.charCodeAt(i);
                }
                return new TextDecoder().decode(bytes);
            } catch (e) {
                return decodeURIComponent(escape(atob(str)));
            }
        }

        async function pullFromGithub(manual=false) {
            if (!data.github) { if (manual) showGithubConfig(); return; }
            const {username, repo, token} = data.github;
            const path = 'mindtodo-data.json';
            try {
                // 添加版本号参数强制刷新缓存
                const cacheBuster = data.github.version ? '?v=' + data.github.version : '';
                const res = await fetch(`https://api.github.com/repos/${username}/${repo}/contents/${path}${cacheBuster}`, {
                    headers: {Authorization: `token ${token}`}
                });
                if (res.status === 401) {
                    const msg = 'Token 已过期，请重新配置';
                    if (manual) { alert(msg); showGithubConfig(); }
                    else { showBanner(msg, 'error'); data.github = null; saveData(); }
                    return;
                }
                if (res.status === 404) {
                    if (manual) alert('远程暂无数据文件');
                    else showBanner('远程暂无数据文件', 'info');
                    data.firstLoaded = true; saveData(); return;
                }
                if (res.status === 409) {
                    const msg = '拉取失败 (409)：仓库可能尚未初始化，请在 GitHub 上先创建 README。';
                    if (manual) alert(msg);
                    else showBanner(msg, 'error');
                    return;
                }
                if (!res.ok) {
                    const msg = '拉取失败：HTTP ' + res.status;
                    if (manual) alert(msg);
                    else showBanner(msg, 'error');
                    data.firstLoaded = true; saveData(); return;
                }
                const info = await res.json();
                const json = base64ToUtf8(info.content);
                const remote = JSON.parse(json);
                if (remote.tasks) data.tasks = remote.tasks;
                if (remote.normalFeelings) data.normalFeelings = remote.normalFeelings;
                if (remote.practiceBlocks) data.practiceBlocks = remote.practiceBlocks;
                if (remote.slots) data.slots = remote.slots;
                if (remote.tags) data.tags = remote.tags;
                if (remote.commonTags) data.commonTags = remote.commonTags;
                if (remote.title) data.title = remote.title;
                // 不覆盖本地的 github.token 配置
                if (remote.github) {
                    if (remote.github.username) data.github.username = remote.github.username;
                    if (remote.github.repo) data.github.repo = remote.github.repo;
                    if (remote.github.issue !== undefined) data.github.issue = remote.github.issue;
                    if (remote.github.lastSync) data.github.lastSync = remote.github.lastSync;
                    if (remote.github.version) data.github.version = remote.github.version;
                }
                data.firstLoaded = true;
                saveData();
                applyTitle();
                render();
                if (manual) {
                    showBanner('拉取成功', 'success');
                } else {
                    showBanner('自动拉取成功', 'success');
                }
            } catch(e) {
                const msg = '拉取失败：' + (e.message || '网络错误');
                if (manual) {
                    alert(msg);
                } else {
                    showBanner(msg, 'error');
                }
                data.firstLoaded = true;
                saveData();
            }
        }

        // ============ Helper Functions ============
        let isPageRefresh = false;
        function checkUpdateStatus() {
            const banner = document.getElementById('updateBanner');
            if (!data.github || !data.github.lastSync) {
                banner.classList.remove('show');
                return;
            }
            // 如果是刷新页面，不显示"待推送"提示
            if (isPageRefresh) {
                banner.classList.remove('show');
                return;
            }
            const lastSync = new Date(data.github.lastSync);
            const lastUpdate = new Date(data.tasks.reduce((max, item) => {
                const itemTime = new Date(item.updatedAt);
                return itemTime > max ? itemTime : max;
            }, new Date(0)));
            if (lastUpdate > lastSync) {
                banner.classList.add('show');
            } else {
                banner.classList.remove('show');
            }
        }

        // ============ Init ============
        loadData();
        isPageRefresh = true; // 标记为刷新页面，不显示"待推送"提示
        initVoice();
        // 设置默认选项卡
        const initialTab = data.activeTab || 'feeling';
        switchMainTab(initialTab);
        applyTitle();
        updateGithubStatus();
        // 刷新页面时自动拉取一次
        pullFromGithub();
        
        // 添加快捷键：Ctrl + Shift + P 触发推送
        document.addEventListener('keydown', function(e) {
            // 确保不在输入框中触发
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') {
                return;
            }
            if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 'p') {
                e.preventDefault();
                pushToGithub();
            }
        });
